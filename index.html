<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmação Rápida</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #f1f5f9;
    }

    .container {
      background: #1e293b;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: #22c55e;
      color: #052e16;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 15px;
      color: #94a3b8;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .question {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 28px;
      color: #f8fafc;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option {
      background: #0f172a;
      border: 2px solid #334155;
      color: #f1f5f9;
      font-size: 20px;
      font-weight: 600;
      padding: 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .option:hover {
      border-color: #3b82f6;
      background: #1e3a5f;
      transform: translateY(-2px);
    }

    .option:active {
      transform: translateY(0);
    }

    .option.correct {
      border-color: #22c55e;
      background: #14532d;
    }

    .option.wrong {
      border-color: #ef4444;
      background: #7f1d1d;
      opacity: 0.7;
      pointer-events: none;
    }

    .feedback {
      margin-top: 24px;
      font-size: 15px;
      min-height: 24px;
      color: #f87171;
      font-weight: 500;
    }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="badge">VERIFICAÇÃO RÁPIDA</div>

    <h1>Confirme que você é humano</h1>
    <p class="subtitle">Responda a pergunta abaixo para continuar e acessar o conteúdo exclusivo.</p>

    <div class="question">Quanto é 1 + 1?</div>

    <div class="options">
      <button class="option" onclick="checkAnswer(this, false)">3</button>
      <button class="option" onclick="checkAnswer(this, true)">2</button>
      <button class="option" onclick="checkAnswer(this, false)">4</button>
      <button class="option" onclick="checkAnswer(this, false)">5</button>
    </div>

    <div class="feedback" id="feedback"></div>

    <p class="footer">Proteção contra robôs • Acesso liberado em segundos</p>
  </div>

  <script>
    // Captura e persiste UTMs / tracking params
    (function() {
      var u = new URLSearchParams(window.location.search);
      var KEYS = [
        'utm_source','utm_medium','utm_campaign','utm_content','utm_term','utm_id',
        'fbclid','ttclid','gclid','_fbp',
        'tsclid',
        'click_id','kwai_click_id','kwclid','callback',
        'src','sck','xcod','cv','shk','ph','_bp','_sp',
        'salesCode','codigo_de_vendas'
      ];
      var captured = {};
      KEYS.forEach(function(k){ var v = u.get(k); if (v) captured[k] = v; });
      try {
        var saved = JSON.parse(sessionStorage.getItem('shark_utms') || '{}');
        Object.keys(captured).forEach(function(k){ saved[k] = captured[k]; });
        sessionStorage.setItem('shark_utms', JSON.stringify(saved));
        captured = saved;
      } catch(e) {}
      function buildLink(originalHref) {
        var url = new URL(originalHref, location.origin);
        Object.keys(captured).forEach(function(k){
          if (!url.searchParams.has(k)) url.searchParams.set(k, captured[k]);
        });
        return url.toString();
      }
      // Reescreve no load, nao no clique. Botao do meio dispara auxclick e "abrir em
      // nova aba" pelo menu de contexto nem chega a disparar evento: com a reescrita
      // presa ao clique, essas aberturas levavam a URL sem parametro nenhum.
      function attach() {
        document.querySelectorAll('a.button, a.cta, a[href*="/l/"], a[href*="/c/"], a[href*="/b/"]').forEach(function(btn){
          try { btn.href = buildLink(btn.href); } catch(err) {}
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', attach);
      } else {
        attach();
      }
      // Botao inserido depois do load tambem precisa nascer decorado.
      try {
        new MutationObserver(attach).observe(document.documentElement, { childList: true, subtree: true });
      } catch(e) {}

      // Expõe os params capturados para o redirecionamento
      window.__sharkUtms = captured;
    })();
  </script>

  <script>
    // Link base do destino final (sem parâmetros)
    const BASE_DESTINO = "https://phantoms.group/l/6d7f18c8";

    function checkAnswer(button, isCorrect) {
      const options = document.querySelectorAll('.option');
      const feedback = document.getElementById('feedback');

      // Desabilita todos os botões
      options.forEach(opt => {
        opt.style.pointerEvents = 'none';
      });

      if (isCorrect) {
        button.classList.add('correct');
        feedback.style.color = '#4ade80';
        feedback.textContent = '✓ Correto! Redirecionando...';
        
        // Redireciona após 800ms repassando UTMs capturados (URL atual + sessionStorage)
        setTimeout(() => {
          const params = new URLSearchParams(window.location.search);

          // Mescla com o que foi salvo no sessionStorage pelo script de UTMs
          try {
            const saved = window.__sharkUtms || JSON.parse(sessionStorage.getItem('shark_utms') || '{}');
            Object.keys(saved).forEach(function(k) {
              if (!params.has(k)) params.set(k, saved[k]);
            });
          } catch(e) {}

          const finalUrl = BASE_DESTINO + (params.toString() ? '?' + params.toString() : '');
          window.location.href = finalUrl;
        }, 800);
      } else {
        button.classList.add('wrong');
        feedback.textContent = 'Resposta incorreta. Tente novamente.';
        
        // Reabilita os botões após 0.5s para tentar de novo
        setTimeout(() => {
          options.forEach(opt => {
            opt.classList.remove('wrong');
            opt.style.pointerEvents = 'auto';
          });
          feedback.textContent = '';
        }, 500);
      }
    }
  </script>
</body>

</html>
